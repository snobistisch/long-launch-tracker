name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test tracker
        run: npm test

      - name: Poll launches and refresh dashboard data
        env:
          LONG_RPC_BLOCK_SPAN: "2000"
          LONG_RPC_CONCURRENCY: "2"
          LONG_RPC_REQUESTS_PER_SECOND: "2"
        run: npm run dashboard:update

      - name: Commit refreshed public data
        run: |
          if ! git diff --quiet -- dashboard/data/launches.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/data/launches.json
            git commit -m "data: refresh LONG launches"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
